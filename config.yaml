site:
  domain: "endearing-druid-acf1d7.netlify.app"
  brand: "Eco Pet Guide"
  niche: "eco-friendly pet products"
offers:
  # Amazon offers are used as an initial monetisation source. Update the affiliate_id
  # with your Amazon Associates tag once you have one.
  - name: "AmazonEcoFriendlyDogToys"
    base_url: "https://www.amazon.com/dp/B004A7X27M"
    affiliate_param: "tag"
    affiliate_id: "YOUR-AMAZON-ASSOCIATES-TAG"
    utm_source: "site"
    utm_campaign: "launch"
  - name: "AmazonBiodegradablePoopBags"
    base_url: "https://www.amazon.com/dp/B07MYPFMZP"
    affiliate_param: "tag"
    affiliate_id: "YOUR-AMAZON-ASSOCIATES-TAG"
    utm_source: "site"
    utm_campaign: "launch"
content:
  # Generate new content every three days. Categories help guide the AI in creating
  # guides, in-depth reviews and product comparisons.
  cadence_days: 3
  
  # Expanded categories for more diverse content generation
  categories: 
    - "guides"
    - "reviews" 
    - "comparisons"
    - "how-to"
    - "listicles"
    - "seasonal"
    - "news"
    - "tips"
    - "buyer-guides"
    - "problem-solving"
    - "lifestyle"
    - "health"
  
  # Product categories for focused content
  product_categories:
    - "dog-toys"
    - "poop-bags"
    - "leashes-collars"
    - "dog-bowls"
    - "dog-beds"
    - "dog-treats"
    - "grooming"
    - "training-tools"
    - "travel-gear"
    - "safety-gear"
    - "outdoor-gear"
    - "senior-dog-products"
    - "puppy-essentials"
    - "cat-products"
    - "small-pet-supplies"
  
  # Article formats and structures
  article_types:
    - name: "Product Review"
      description: "In-depth review of a specific product"
      target_length: "800-1200"
      includes_comparison: true
    - name: "Comparison Guide"
      description: "Compare 2-5 similar products"
      target_length: "1000-1500"
      includes_comparison: true
    - name: "Buyer's Guide"
      description: "Complete guide to buying in a category"
      target_length: "1200-1800"
      includes_comparison: true
    - name: "How-To Guide"
      description: "Step-by-step instructional content"
      target_length: "800-1200"
      includes_comparison: false
    - name: "Top 10 List"
      description: "Ranked list of products or tips"
      target_length: "1000-1400"
      includes_comparison: true
    - name: "Problem Solver"
      description: "Address specific pet owner problems"
      target_length: "600-1000"
      includes_comparison: false
    - name: "Seasonal Guide"
      description: "Season-specific product recommendations"
      target_length: "800-1200"
      includes_comparison: true
    - name: "News & Trends"
      description: "Latest eco-friendly pet product trends"
      target_length: "600-900"
      includes_comparison: false
  
  # Content themes and angles
  content_angles:
    - "sustainability-focused"
    - "budget-friendly"
    - "premium-quality"
    - "beginner-friendly"
    - "expert-level"
    - "problem-solving"
    - "health-focused"
    - "convenience-focused"
    - "safety-first"
    - "trend-following"
    - "scientific-backed"
    - "user-experience"
  
  # SEO and content optimization
  seo_strategies:
    - "long-tail-keywords"
    - "local-seo"
    - "seasonal-seo"
    - "competitor-analysis"
    - "featured-snippets"
    - "question-based"
    - "comparison-focused"
    - "review-focused"
  
  # Target audiences for content personalization
  target_audiences:
    - "first-time-pet-owners"
    - "experienced-pet-owners"
    - "eco-conscious-consumers"
    - "budget-conscious-shoppers"
    - "premium-buyers"
    - "senior-pet-owners"
    - "puppy-parents"
    - "apartment-dwellers"
    - "outdoor-enthusiasts"
    - "health-conscious-owners"
    - "busy-professionals"
    - "large-family-households"

ab_tests:
  # Define A/B test slugs to experiment with page elements like headlines or CTA
  - slug: "eco-friendly-dog-toys"
    variants: ["A", "B"]
email:
  # MailerLite has a generous free tier; once you have a list set up, provide its ID here
  provider: "MailerLite"
  list_id: ""